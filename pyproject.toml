[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prescan"
version = "0.1.0"
description = "Evidence-backed first draft of a company's AI-system inventory, plus the questions to ask them"
requires-python = ">=3.12"
authors = [{ name = "Nnanyelugo Ahukannah" }]

# Mirrors requirements.txt. Kept here as well so `pip install -e .` alone is a working setup —
# the package lives under src/, and without an install the documented commands fail with
# "No module named ai_prescan" for anyone who clones the repository.
dependencies = [
  "langgraph>=1.2.10",
  "langchain>=1.3.14",
  "langchain-core>=1.5.2",
  "langchain-openai>=1.4.1",
  "openai>=2.45.0",
  "pinecone>=7.3.0",
  "requests>=2.34.2",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.15.0",
  "tenacity>=9.1.4",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "playwright>=1.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-prescan = "ai_prescan.cli:main"
ai-prescan-web = "ai_prescan.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
